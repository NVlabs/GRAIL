# ═══════════════════════════════════════════════════════════════════════════════
# 4D HOI Reconstruction — LOCOMOTION / TERRAIN (native SOMA03 body model)
#
# Same as loco_smplx.yaml — only body_model and SMPL-X-specific paths differ.
# All optimization weights, filters, and post-processing settings are kept in
# sync with the SMPL-X variant by design.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Directory paths ───────────────────────────────────────────────────────────
paths:
  results_dir: "results"
  video_dir: "generation/videos_kling"
  hmr_dir: "generation/hmr_gem_x_native77"
  hmr_cache_dir: "generation/hmr_gem_x_native77_cache"
  foundation_pose_dir: "generation/foundation_pose"
  foundation_pose_output_dir: "generation/foundation_pose_output"
  recon_cache_dir: "generation/4dhoi_recon_soma03_cache"
  depth_gt_dir: "generation/depth_maps"
  output_dir: "generation/4dhoi_recon_soma03"
  vis_scenepic_dir: "generation/vis_html_soma03"

# ── Human model config ────────────────────────────────────────────────────────
human_model:
  body_model: "soma03"
  static_cam: true
  human_pose_backend: "gem_x"
  gem_x_source_root: "imports/GEM-X"
  gem_x_config_path: "imports/GEM-X/docs/configs/body_video_native77.yaml"
  gem_x_python: "imports/GEM-X/.venv/bin/python"
  gem_x_device: cuda
  gem_x_postprocess: false
  gem_x_human_crop_repair: true
  gem_x_human_crop_config:
    max_crop_scale: 3.0
    max_mask_image_fraction: 0.65
    min_box_mask_overlap: 0.10
    min_support_frames: 2
    padding_fraction: 0.03
    smoothing_radius: 2
  soma_runtime: "gem_x"
  gem_x_soma_assets: "imports/GEM-X/assets/soma"
  soma_identity_params_path: "data/body_profiles/unitree_g1/soma/soma03_custom_smplx_identity.npz"

# ── Object pose tracking config ──────────────────────────────────────────────
obj_pose_tracking:
  foundation_pose_debug: 2
  crop_image: false
  interpolation_factor: 1

# ── Optimization config (passed to HOIOptimizer) ─────────────────────────────
optimization:
  log_dir: "logs"
  exp_name: "static_cam"
  use_global: False

  cache_list:
    - contact_labels

  vis_cfg:
    vis_init: false
    enable: true
    render_video: true
    extra_views:
      - "top"
    export_mesh: false
    vis_html: true
    vis_contact: true

  opt_stage_specs:
    init_opt:
      opt_vars:
        human_trans_global:
          lr: 0.003
        human_trans_res:
          lr: 0.003
        human_pose_res:
          lr: 0.0001
        obj_t_res:
          lr: 0.003
        obj_R_res:
          lr: 0.0001
      niter: 600
      loss_cfg:
        keypoint_tracking:
          weight: 0.3
          beta: 0.1
        human_smoothness:
          weight: 30.0
          beta: 0.1
        human_pose_reg:
          weight: 100.0
        human_foot_contact:
          weight: 10.0
        human_global_init_reg:
          weight: 3000.0
        verts_tracking:
          weight: 0.3
        obj_smoothness:
          weight: 50.0
        depth_pointcloud:
          weight: 100.0
          duration: "all"
          interval: 1
          num_gt_samples: 3000
          trim_pct: 0.2
          depth_tol: 0.02

  eval:
    keypoint_tracking:
      weight: 0.1
      beta: 0.1
      threshold: 2.0
    contact:
      weight: 100000.0
      duration: "all"
      threshold: 5.0
      max_contact_dist: 0.15

# ── Filtering config ────────────────────────────────────────
filtering:
  camera_trans_thr: 0.1
  object_mask_tol: 0.5
  total_mask_tol: 0.3
  human_static_thr: 0.01
  min_frames: null
  filter_object_motion: "static_only"  # LOCO: keep only static-object recons
  object_static_thr: 0.02

# ── Post-processing config ────────────────────────────────────────
post_processing:
  center_at_object: true
  compute_contact_points_nframes_before_inter_start: 48

# ── Pipeline control ─────────────────────────────────────────────────────────
pipeline:
  skip_step1: false
  skip_step2: false
  skip_step3: false
  skip_step4: false
  skip_step5: false
  skip_step6: false
  skip_done: false
  verbose: false
  vis_valid_only: false
  is_static_obj: true  # LOCO: terrain/seat doesn't move → bypass FoundationPose

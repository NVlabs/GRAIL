# GEM-X native77 final775 with native SOMA-X 0.3.3 for locomotion/terrain/sitting.
# Source estimation retains predicted shape and source timing. The separate
# fixed G1 identity is applied during downstream reconstruction placement.
# Terrain/seat objects remain static: FoundationPose is bypassed and the filter
# keeps static-object reconstructions; human losses use native SOMA joints.
# The existing numerical Stage 1 requires reviewed finite terrain support.
# Missing support inputs are errors; zero-iteration probes do not fit.

# ── Directory paths ───────────────────────────────────────────────────────────
paths:
  results_dir: "results"
  video_dir: "generation/videos_kling"
  hmr_dir: "generation/hmr_gem_x_native77"
  hmr_cache_dir: "generation/hmr_gem_x_native77_cache"
  foundation_pose_dir: "generation/foundation_pose"
  foundation_pose_output_dir: "generation/foundation_pose_output"
  recon_cache_dir: "generation/4dhoi_recon_soma03_cache"
  depth_gt_dir: "generation/depth_maps"
  output_dir: "generation/4dhoi_recon_soma03"
  vis_scenepic_dir: "generation/vis_html_soma03"

# ── Human model config ────────────────────────────────────────────────────────
human_model:
  body_model: "soma03"
  static_cam: true
  human_pose_backend: "gem_x"
  gem_x_source_root: "imports/GEM-X"
  gem_x_config_path: "imports/GEM-X/docs/configs/body_video_native77.yaml"
  gem_x_python: "imports/GEM-X/.venv/bin/python"
  gem_x_device: cuda
  gem_x_postprocess: false
  # Bind source SAM2 masks before native77 observations and Body Pose features.
  gem_x_human_crop_repair: true
  gem_x_human_crop_config:
    max_crop_scale: 3.0
    max_mask_image_fraction: 0.65
    min_box_mask_overlap: 0.10
    min_support_frames: 2
    padding_fraction: 0.03
    smoothing_radius: 2
  soma_runtime: "gem_x"
  gem_x_soma_assets: "imports/GEM-X/assets/soma"
  soma_identity_params_path: "data/body_profiles/unitree_g1/soma/soma03_custom_smplx_identity.npz"

# ── Object pose tracking config ──────────────────────────────────────────────
obj_pose_tracking:
  foundation_pose_debug: 2
  crop_image: false
  interpolation_factor: 1

# ── Optimization config (passed to HOIOptimizer) ─────────────────────────────
optimization:
  foot_support_mode: terrain  # Fixed by the locomotion config family.
  log_dir: "logs"
  exp_name: "static_cam"
  use_global: False

  cache_list: []

  vis_cfg:
    vis_init: false
    enable: true
    render_video: true
    extra_views:
      - "top"
    export_mesh: false
    vis_html: true
    vis_contact: true
    vis_foot_contact: true
    foot_contact_threshold: 0.4

  opt_stage_specs:
    init_opt:
      opt_vars:
        human_trans_global:
          lr: 0.003
        human_trans_res:
          lr: 0.003
        human_pose_res:
          lr: 0.001
        obj_t_res:
          lr: 0.003
        obj_R_res:
          lr: 0.0001
      niter: 400
      loss_cfg:
        keypoint_tracking:
          weight: 0.3
          confidence_threshold: 0.9  # Strict >; native77 raw heatmap scores (not probabilities)
          beta: 0.1
        human_smoothness:
          weight: 30.0
          beta: 0.1
        human_pose_reg:
          weight: 100.0
        human_foot_contact:
          weight: 30.0
          label_source: scene_support  # Same reviewed intervals as tread support.
          point_mode: foot_parts
          velocity_space: planar
          options:
            fps: source
            normal_velocity_weight: 0.0
            long_horizon_lag: 4
            long_horizon_weight: 0.25
            tangent_blend_frames: 3
        human_global_init_reg:
          weight: 3000.0
          mode: root_relative_velocity
          relative_frame: root  # Full inverse root rotation before frame differences
          root_joint_index: 0  # Native SOMA Hips; all other 76 joints included
          root_speed_weight: 1.0
          joint_velocity_weight: 1.0
        verts_tracking:
          weight: 0.3
        obj_smoothness:
          weight: 50.0
        depth_pointcloud:
          weight: 100.0
          duration: "all"
          interval: 1
          num_gt_samples: 3000
          trim_pct: 0.2
          depth_tol: 0.02
        human_scene_support:
          weight: 300.0
          penetration_weight: 2.0
          support_weight: 1.0
          tangent_weight: 2.0
          boundary_weight: 1.0
          robust_delta_m: 0.005
          height_blend_frames: 0
          tangent_blend_frames: 3
        human_scene_support_temporal:
          weight: 1.0
          component_weights:
            no_slip: 0.0
            window_velocity: 0.1
            window_acceleration: 0.1
          options:
            fps: source
            window_frames: 4
            velocity_scale_mps: 0.35
            acceleration_scale_mps2: 3.0
            correction_speed_tolerance_mps: 0.15
            acceleration_tolerance_mps2: 3.0
            normal_velocity_weight: 0.25
            long_horizon_lag: 4
            long_horizon_weight: 0.25
            tangent_blend_frames: 3

  eval:
    keypoint_tracking:
      weight: 0.1
      confidence_threshold: 0.9
      beta: 0.1
      threshold: 2.0
    # Hand-object VLM contact evaluation removed. Foot-contact terms stay above.

# ── Filtering config ────────────────────────────────────────
filtering:
  camera_trans_thr: 0.1
  object_mask_tol: 0.5
  total_mask_tol: 0.3
  human_static_thr: 0.01
  min_frames: null
  filter_object_motion: "static_only"  # LOCO: keep only static-object recons (terrain, sitting)
  object_static_thr: 0.02

# ── Post-processing config ────────────────────────────────────────
post_processing:
  center_at_object: true
  compute_contact_points_nframes_before_inter_start: 48

# ── Pipeline control ─────────────────────────────────────────────────────────
pipeline:
  skip_step1: false
  skip_step2: false
  skip_step3: false
  skip_step4: false
  skip_step5: false
  skip_step6: false
  skip_done: false
  verbose: false
  vis_valid_only: false
  is_static_obj: true  # LOCO: terrain/seat doesn't move → bypass FoundationPose

# GEM-X native77 final775 with native SOMA-X 0.3.3 and fixed G1 identity.
# Estimation preserves source FPS/frame count and raw predicted shape. The fixed
# identity is applied only when constructing the reconstruction human model.
# Historical checkpoints retain their archived model/configuration bindings.

# ── Directory paths ───────────────────────────────────────────────────────────
paths:
  results_dir: "results"
  video_dir: "generation/videos_kling"
  hmr_dir: "generation/hmr_gem_x_native77"
  hmr_cache_dir: "generation/hmr_gem_x_native77_cache"
  foundation_pose_dir: "generation/foundation_pose"
  foundation_pose_output_dir: "generation/object_pose_mose3_fp"
  recon_cache_dir: "generation/4dhoi_recon_soma03_cache"
  depth_gt_dir: "generation/depth_maps"
  output_dir: "generation/4dhoi_recon_soma03"
  vis_scenepic_dir: "generation/vis_html_soma03"

# ── Human model config ────────────────────────────────────────────────────────
human_model:
  body_model: "soma03"
  static_cam: true
  human_pose_backend: "gem_x"
  gem_x_source_root: "imports/GEM-X"
  gem_x_config_path: "imports/GEM-X/docs/configs/body_video_native77.yaml"
  gem_x_python: "imports/GEM-X/.venv/bin/python"
  gem_x_device: cuda
  gem_x_postprocess: false
  # Bind source SAM2 masks before native77 observations and Body Pose features.
  gem_x_human_crop_repair: true
  gem_x_human_crop_config:
    max_crop_scale: 3.0
    max_mask_image_fraction: 0.65
    min_box_mask_overlap: 0.10
    min_support_frames: 2
    padding_fraction: 0.03
    smoothing_radius: 2
  soma_runtime: "gem_x"
  gem_x_soma_assets: "imports/GEM-X/assets/soma"
  soma_identity_params_path: "data/body_profiles/unitree_g1/soma/soma03_custom_smplx_identity.npz"

# ── Object pose tracking config ──────────────────────────────────────────────
obj_pose_tracking:
  object_tracking_backend: mose3_fp_hybrid
  object_tracking_config: configs/object_tracking/mose3_fp_hybrid.yaml
  foundation_pose_debug: 2
  crop_image: false
  interpolation_factor: 1

# ── Optimization config (passed to HOIOptimizer) ─────────────────────────────
optimization:
  foot_support_mode: plane  # Fixed by the manipulation config family.
  log_dir: "logs"
  exp_name: "static_cam"
  use_global: False

  cache_list: []
  # Export original surface IDs/binding during Stage 1 for video interval authoring.
  export_contact_review_inputs: true
  # Review the actual optimized sequence; do not apply a blind post-fit filter.
  output_smoothing: false

  vis_cfg:
    vis_init: true
    enable: true
    render_video: true
    extra_views:
      - "top"
    export_mesh: false
    vis_html: true
    vis_contact: true

  opt_stage_specs:
    init_opt:
      opt_vars:
        human_trans_global:
          lr: 0.003
        human_trans_res:
          lr: 0.003
        human_pose_res:
          lr: 0.001
        obj_t_res:
          lr: 0.003
        obj_R_res:
          lr: 0.0001
      niter: 400
      loss_cfg:
        keypoint_tracking:
          weight: 0.3
          confidence_threshold: 0.9  # Strict >; native77 raw heatmap scores (not probabilities)
          beta: 0.1
        human_smoothness:
          weight: 30.0
          beta: 0.1
        human_pose_reg:
          weight: 100.0
        human_foot_contact:
          label_source: gem
          weight: 30.0
          point_mode: foot_parts  # Native whole-foot/toe regions, gated independently
          velocity_space: planar
          gravity_axis: z
          weight_mode: hard
          threshold: 0.5  # GEM support confidence; separate from 2D validity
          long_horizon_lag: 4
          long_horizon_weight: 1.0
          stance_weight: 2.0  # Suppress cumulative drift within each support interval
          stance_min_frames: 3
          stance_robust_delta_m: 0.005
        # Supply the measured plane and its provenance explicitly; no default floor.
        human_foot_ground:
          weight: 300.0
          penetration_weight: 2.0
          support_weight: 1.0
          support_threshold: 0.5
          robust_delta_m: 0.005
          support_height_m: 0.002  # Small explicit clearance, below the 1 cm review limit.
          penetration_margin_m: 0.002  # Apply the soft barrier at the same sole target.
          plane: null  # Required: {normal: [0, 0, 1], offset_m: ..., source: ...}.
        human_foot_ground_temporal:
          weight: 1.0
          component_weights:
            window_velocity: 0.1
            window_acceleration: 0.1
          options:
            fps: source
            threshold: 0.5
            window_frames: 4
            velocity_scale_mps: 0.35
            acceleration_scale_mps2: 3.0
            correction_speed_tolerance_mps: 0.15
            acceleration_tolerance_mps2: 3.0
        human_global_init_reg:
          weight: 3000.0
          mode: root_relative_velocity
          relative_frame: root  # Full inverse root rotation before frame differences
          root_joint_index: 0  # Native SOMA Hips; all other 76 joints included
          root_speed_weight: 1.0
          joint_velocity_weight: 1.0
        verts_tracking:
          weight: 0.3
        obj_smoothness:
          weight: 50.0
        depth_pointcloud:
          weight: 100.0
          duration: "all"
          interval: 1
          num_gt_samples: 3000
          trim_pct: 0.2
          depth_tol: 0.02

    contact_opt:
      opt_vars:
        human_trans_global:
          lr: 0.003
        human_trans_res:
          lr: 0.003
        human_pose_res:
          lr: 0.001
        obj_t_res:
          lr: 0.003
        obj_R_res:
          lr: 0.0001
      niter: 200
      loss_cfg:
        keypoint_tracking:
          weight: 0.3
          confidence_threshold: 0.9  # Strict >; native77 raw heatmap scores (not probabilities)
          beta: 0.1
        human_smoothness:
          weight: 30.0
          beta: 0.1
        human_pose_reg:
          weight: 100.0
        human_foot_contact:
          label_source: gem
          weight: 10.0
          point_mode: foot_parts
          velocity_space: planar
          gravity_axis: z
          weight_mode: hard
          threshold: 0.5
          long_horizon_lag: 4
          long_horizon_weight: 1.0
          stance_weight: 2.0
          stance_min_frames: 3
          stance_robust_delta_m: 0.005
        # Supply the measured plane and its provenance explicitly; no default floor.
        human_foot_ground:
          weight: 300.0
          penetration_weight: 2.0
          support_weight: 1.0
          support_threshold: 0.5
          robust_delta_m: 0.005
          support_height_m: 0.002  # Small explicit clearance, below the 1 cm review limit.
          penetration_margin_m: 0.002  # Apply the soft barrier at the same sole target.
          plane: null  # Required: {normal: [0, 0, 1], offset_m: ..., source: ...}.
        human_foot_ground_temporal:
          weight: 1.0
          component_weights:
            window_velocity: 0.1
            window_acceleration: 0.1
          options:
            fps: source
            threshold: 0.5
            window_frames: 4
            velocity_scale_mps: 0.35
            acceleration_scale_mps2: 3.0
            correction_speed_tolerance_mps: 0.15
            acceleration_tolerance_mps2: 3.0
        human_global_init_reg:
          weight: 3000.0
          mode: root_relative_velocity
          relative_frame: root  # Full inverse root rotation before frame differences
          root_joint_index: 0  # Native SOMA Hips; all other 76 joints included
          root_speed_weight: 1.0
          joint_velocity_weight: 1.0
        obj_precontact_reg:
          weight: 100.0
        verts_tracking:
          weight: 0.3
        obj_smoothness:
          weight: 50.0
        # Stage 2 uses depth for review only; Stage 1 retains its depth loss.
        contact: &stage2_regional_contact
          weight: 30000.0
          mode: phase_contact_map
          # Author native hand/object regions from this video's contact intervals.
          prediction_path: "{cache_dir}/contact_maps/{sequence}.json"
          partial_mass_fraction: 0.25
          pair_temperature_m2: 0.000016
          coverage_temperature_m2: 0.000016
          robust_delta_m: 0.01
          gap_tolerance_m: 0.001
          normal_distance_scale_m: 0.005
          min_opposing_cosine: 0.5
          activation_ramp_frames: 1  # Full attraction at the reviewed first touch.
          phase_blend_frames: 4
        phase_contact_temporal:
          weight: 1.0
          # Inherits the same group's contact; no separately drifting map settings.
          # This source-reviewed sidecar supplies FPS, stable holds and windows.
          # No case-specific frame/region IDs are inferred from object motion.
          scope_path: "{cache_dir}/contact_maps/{sequence}.temporal.json"
          component_weights:
            hold_relative_velocity: 0.1
            window_velocity: 0.4
            window_acceleration: 0.4
          options:
            hold_ramp_frames: 4
            hold_speed_tolerance_mps: 0.02
            hold_speed_scale_mps: 0.05
            window_speed_tolerance_mps: 0.35
            window_speed_scale_mps: 0.35
            window_acceleration_tolerance_mps2: 3.0
            window_acceleration_scale_mps2: 3.0

  eval:
    keypoint_tracking:
      weight: 0.1
      confidence_threshold: 0.9
      beta: 0.1
      threshold: 2.0
    # Regional loss is diagnostic; a fixed-pair threshold does not transfer.
    contact: *stage2_regional_contact

# ── Filtering config ────────────────────────────────────────
filtering:
  camera_trans_thr: 0.1
  object_mask_tol: 0.5
  total_mask_tol: 0.3
  human_static_thr: 0.01
  min_frames: null
  filter_object_motion: "dynamic_only"  # MANIPULATION: drop static-object recons
  object_static_thr: 0.02

# ── Post-processing config ────────────────────────────────────────
post_processing:
  center_at_object: true
  compute_contact_points_nframes_before_inter_start: 48

# ── Pipeline control ─────────────────────────────────────────────────────────
pipeline:
  skip_step1: false
  skip_step2: false
  skip_step3: false
  skip_step4: false
  skip_step5: false
  skip_step6: false
  skip_done: false
  verbose: false
  vis_valid_only: false
  is_static_obj: false  # MANIPULATION: object moves → run FoundationPose

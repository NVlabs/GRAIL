# @package _global_
# D rewards/labels/optimizer, with the existing 29-D body factor and decoder LoRA.
defaults:
  - /exp/manager/universal_token/hoi/advanced_manip_ground_unified_contactfirst_ablation_d
  - _self_
exp_var: advanced_manip_ground_unified_contactfirst_d_sonic_lora
algo:
  config:
    sonic_lora_factored_ppo: true
    actor:
      _target_: gear_sonic.trl.modules.sonic_decoder_lora.SonicDecoderLoRAActor
      sonic_decoder_lora:
        target_decoder: g1_dyn
        rank: 8
        alpha: 16
        dropout: 0.0
        latent_dim: 64
        stochastic_body: true
        body_action_dim: 29
        body_action_std: 0.05
        learning_rate: 1.0e-4
manager_env:
  config:
    stochastic_decoder_body_action_dim: 29
